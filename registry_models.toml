# ---------------------------------------------------------------------
# claude-code — subprocess-stream CLI (self-executing tool loop)
# ---------------------------------------------------------------------

[[model]]
lane = "claude-code"
id = "claude-opus-4-8"
provider = "claude-code"
context_window = 200000
max_output_tokens = 32000
[model.capabilities]
tools = true          # tool_use surfaces via ToolInvocation records; CLI executes, not bridle
parallel_tools = true
streaming = true
reasoning_effort = true
structured_output = false
prompt_caching = true
vision = true
# "append" is agora POLICY (preserve claude-code's built-in prompt), not a
# hard gate — the CLI genuinely supports both --system-prompt and
# --append-system-prompt (v2.1.177+).
system_prompt_mode = "append"

[[model]]
lane = "claude-code"
id = "claude-sonnet-5"
provider = "claude-code"
context_window = 200000
max_output_tokens = 64000
[model.capabilities]
tools = true
parallel_tools = true
streaming = true
reasoning_effort = true
structured_output = false
prompt_caching = true
vision = true
system_prompt_mode = "append"

