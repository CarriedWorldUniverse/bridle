# registry_models.toml — static, compiled-in model catalog (T1/T7 facade
# skeleton, NEX-767). ONLY the 7 core lanes get rows: claude-api,
# claude-code, claude-sdk, openai, deepseek, gemini-api, bedrock, ollama.
# An uncataloged lane errors "not cataloged" at Registry.Resolve — that IS
# the core-lanes-only enforcement (no separate allowlist needed).
#
# Model release properties belong under code-review discipline (this
# file, reviewed via PR), not runtime strings.
#
# ⚠ VERIFY BEFORE RELYING ON FOR BILLING/BUDGETING: context_window,
# max_output_tokens, and pricing below are BEST-EFFORT values authored
# 2026-07-17 by the facade builder — several are educated-guess
# placeholders (flagged per-row below and in the builder's PR report),
# not confirmed against current provider docs. Aliases are NOT baked in
# here (agora-config-sourced via Registry.RegisterAlias).

# ---------------------------------------------------------------------
# claude-api — direct Anthropic Messages API
# ---------------------------------------------------------------------

[[model]]
lane = "claude-api"
id = "claude-opus-4-8"
provider = "claude-api"
context_window = 200000
max_output_tokens = 32000
[model.capabilities]
tools = true
parallel_tools = true
streaming = true
reasoning_effort = true
structured_output = false
prompt_caching = true
vision = true
system_prompt_mode = "append"
[model.pricing] # GUESS — verify against current Anthropic pricing page
in = 15.0
out = 75.0
cached = 1.5

